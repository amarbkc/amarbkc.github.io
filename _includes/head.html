<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{%- comment -%}
  Apply the saved/system theme before CSS paints, so there is no light/dark flash.
{%- endcomment %}
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
    document.documentElement.classList.add("js");
  })();
</script>
{% seo %}
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% feed_meta %}
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
{%- if site.og_image != "" and page.image == nil %}
<meta property="og:image" content="{{ site.og_image | absolute_url }}">
{%- endif %}
{%- if page.math %}
{% include mathjax.html %}
{%- endif %}
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
