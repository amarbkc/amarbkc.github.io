{%- comment -%}
  Interactive, step-through KMP simulation (assets/js/kmp-sim.js).
  Usage: {% include kmp-simulation.html text="ababcabcabababd" pattern="ababd" caption="…" %}
  Without JavaScript the reader sees the note inside <noscript>.
{%- endcomment -%}
<figure class="stepsim strfig" data-kmp-sim data-text="{{ include.text | escape }}" data-pattern="{{ include.pattern | escape }}">
<div class="strfig__scroll" data-sim-stage></div>
<p class="stepsim__readout" data-sim-readout></p>
<p class="stepsim__msg" data-sim-msg aria-live="polite"></p>
<p class="stepsim__result" data-sim-result hidden></p>
<div class="stepsim__controls">
<button type="button" class="button" data-sim-prev>Previous</button>
<button type="button" class="button" data-sim-next>Next</button>
<button type="button" class="button" data-sim-play>Play</button>
<button type="button" class="button" data-sim-reset>Restart</button>
<span class="stepsim__counter" data-sim-counter></span>
</div>
<ul class="strfig__legend" aria-label="Legend">
<li><span class="strfig__cell is-match">a</span> compared, equal</li>
<li><span class="strfig__cell is-kept">a</span> known from LPS, not re-compared</li>
<li><span class="strfig__cell is-miss">a</span> mismatch</li>
</ul>
<noscript><p class="stepsim__msg">This step-through simulation needs JavaScript. The search of <code>{{ include.text | escape }}</code> for <code>{{ include.pattern | escape }}</code> is described in the text around it.</p></noscript>
{%- if include.caption %}
<figcaption>{{ include.caption }}</figcaption>
{%- endif %}
</figure>
<script src="{{ '/assets/js/kmp-sim.js' | relative_url }}" defer></script>
